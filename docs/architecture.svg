<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 290" width="1110" height="290" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1110" height="290" rx="12" fill="#ffffff" stroke="#e2e8f0"/>

  <!-- input clock -->
  <text x="22" y="95" font-size="13" fill="#334155" font-weight="600">100 MHz</text>
  <text x="22" y="112" font-size="11" fill="#64748b">sys clk</text>
  <line x1="88" y1="100" x2="158" y2="100" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- clocking wizard -->
  <rect x="160" y="55" width="170" height="90" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="245" y="88" font-size="15" text-anchor="middle" font-weight="700" fill="#0c4a6e">Clocking Wizard</text>
  <text x="245" y="108" font-size="12" text-anchor="middle" fill="#075985">MMCM</text>
  <text x="245" y="128" font-size="11" text-anchor="middle" fill="#0369a1" font-family="Consolas, monospace">clk_wiz_0</text>

  <!-- pixel clock -->
  <line x1="330" y1="100" x2="438" y2="100" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="384" y="82" font-size="12" text-anchor="middle" fill="#0369a1" font-family="Consolas, monospace">pix_clk</text>
  <text x="384" y="120" font-size="11" text-anchor="middle" fill="#64748b">25.175 MHz</text>

  <!-- timing generator -->
  <rect x="440" y="55" width="210" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="545" y="88" font-size="15" text-anchor="middle" font-weight="700" fill="#14532d">Timing generator</text>
  <text x="545" y="108" font-size="12" text-anchor="middle" fill="#166534">+ colour bars</text>
  <text x="545" y="128" font-size="11" text-anchor="middle" fill="#15803d" font-family="Consolas, monospace">top_hdmi.v</text>

  <!-- video bus -->
  <line x1="650" y1="100" x2="788" y2="100" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="719" y="82" font-size="12" text-anchor="middle" fill="#334155" font-family="Consolas, monospace">RGB [23:0]</text>
  <text x="719" y="120" font-size="11" text-anchor="middle" fill="#64748b">HSync · VSync · DE</text>

  <!-- rgb2dvi -->
  <rect x="790" y="55" width="170" height="90" rx="10" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
  <text x="875" y="88" font-size="15" text-anchor="middle" font-weight="700" fill="#581c87">rgb2dvi</text>
  <text x="875" y="108" font-size="12" text-anchor="middle" fill="#6b21a8">TMDS 8b/10b encode</text>
  <text x="875" y="126" font-size="12" text-anchor="middle" fill="#6b21a8">10:1 serialise</text>

  <!-- TMDS out -->
  <line x1="960" y1="100" x2="1018" y2="100" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="989" y="88" font-size="11" text-anchor="middle" fill="#334155" font-weight="600">TMDS</text>
  <text x="989" y="120" font-size="10" text-anchor="middle" fill="#64748b">4 pairs</text>

  <!-- HDMI port -->
  <rect x="1020" y="70" width="70" height="60" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="1055" y="97" font-size="14" text-anchor="middle" font-weight="700" fill="#1e293b">HDMI</text>
  <text x="1055" y="115" font-size="11" text-anchor="middle" fill="#475569">TX port</text>

  <!-- 5x serial clock -->
  <polyline points="290,145 290,200 860,200 860,147" fill="none" stroke="#0284c7" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-blue)"/>
  <text x="575" y="192" font-size="12" text-anchor="middle" fill="#0369a1"><tspan font-family="Consolas, monospace">pix_clk_5x</tspan>  ·  125.875 MHz serial clock (DDR)</text>

  <!-- reset -->
  <text x="22" y="255" font-size="12" fill="#b91c1c" font-weight="600" font-family="Consolas, monospace">reset_btn</text>
  <polyline points="96,250 200,250 200,147" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <polyline points="200,250 930,250 930,147" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <circle cx="200" cy="250" r="3" fill="#dc2626"/>
  <text x="575" y="270" font-size="11" text-anchor="middle" fill="#b91c1c">aRst = reset_btn OR NOT locked  (encoder held in reset until the MMCM locks)</text>
</svg>
